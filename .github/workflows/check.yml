name: Check sources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check mirrored SDK sources
        run: python3 tools/check_sources.py
      - name: Test dgplugin tools
        run: python3 -m unittest discover -s tests -v
